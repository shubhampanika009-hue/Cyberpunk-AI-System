<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk AI - Matrix Core</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle at center, #050b14 0%, #010408 100%);
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
            padding: 12px;
            border: 2px solid #00ffcc;
            box-shadow: inset 0 0 30px rgba(0, 255, 204, 0.15);
        }
        .header {
            text-align: center;
            width: 100%;
            padding: 10px;
            background: rgba(0, 255, 204, 0.03);
            border-bottom: 1px dashed rgba(0, 255, 204, 0.4);
        }
        .ai-title {
            font-size: 22px;
            font-weight: 900;
            color: #00ffcc;
            text-shadow: 0 0 15px #00ffcc, 0 0 30px #0077ff;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .ai-subtitle {
            font-size: 10px;
            color: #ff0055;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #ff0055;
            margin-top: 2px;
        }
        .chat-container {
            width: 100%;
            max-width: 480px;
            flex: 1;
            background: rgba(2, 8, 20, 0.85);
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 8px;
            margin: 10px 0;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }
        .message {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            max-width: 88%;
            line-height: 1.5;
        }
        .user-msg {
            background: rgba(255, 0, 85, 0.15);
            border: 1px solid #ff0055;
            color: #ffffff;
            align-self: flex-end;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.2);
        }
        .ai-msg {
            background: rgba(0, 255, 204, 0.08);
            border: 1px solid #00ffcc;
            color: #ccfffa;
            align-self: flex-start;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.2);
        }
        .input-panel {
            width: 100%;
            max-width: 480px;
            display: flex;
            gap: 8px;
            margin-bottom: 5px;
        }
        .text-input {
            flex: 1;
            background: rgba(1, 4, 10, 0.95);
            border: 1px solid #00ffcc;
            border-radius: 6px;
            padding: 10px 14px;
            color: #00ffcc;
            font-size: 13px;
            outline: none;
            box-shadow: inset 0 0 8px rgba(0, 255, 204, 0.2);
        }
        .text-input::placeholder {
            color: rgba(0, 255, 204, 0.3);
        }
        .action-btn {
            background: linear-gradient(135deg, #ff0055, #00ffcc);
            color: #010408;
            border: none;
            padding: 0 16px;
            font-size: 13px;
            font-weight: 900;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            text-transform: uppercase;
        }
        .action-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="ai-title">⚡ MATRIX CYBER-AI ⚡</div>
        <div class="ai-subtitle">UNRESTRICTED // SYSTEM OVERRIDE</div>
    </div>

    <div class="chat-container" id="chatBox">
        <div class="message ai-msg">[SYSTEM]: न्यूरल मैट्रिक्स कनेक्ट हो चुका है, राजा। कमांड दीजिए, बिना किसी पाबंदी के हर सवाल का जवाब मिलेगा।</div>
    </div>

    <div class="input-panel">
        <input type="text" id="userInput" class="text-input" placeholder="यहाँ कमांड या कोड टाइप करें...">
        <button class="action-btn" id="sendBtn">EXEC</button>
        <button class="action-btn" id="micBtn">🎙️</button>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender === 'user' ? 'user-msg' : 'ai-msg'}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function processCyberQuery(query) {
            appendMessage("मैटrix स्कैनिंग जारी है...", 'ai');
            let loadingMsg = chatBox.lastChild;

            setTimeout(() => {
                chatBox.removeChild(loadingMsg);
                let q = query.toLowerCase();
                let reply = `[EXECUTION RESULT]: "${query}" के लिए सभी सुरक्षा परतें हटा दी गई हैं। यह रहा आपका पूरा तकनीकी विवरण और डेटा।`;

                if (q.includes('hack') || q.includes('हैकिंग') || q.includes('security')) {
                    reply = "[SECURITY OVERRIDE]: पेनिट्रेशन टेस्टिंग, वल्नरेबिलिटी स्कैनिंग और नेटवर्क एक्सप्लॉइटेशन के सभी टूल्स और कोड यहाँ अरेस्ट फ्री तरीके से निष्पादित किए जा सकते हैं।";
                } else if (q.includes('code') || q.includes('코딩') || q.includes('कोडिंग')) {
                    reply = "[COMPILER READY]: पाइथन, सी++, और जावास्क्रिप्ट का सिंटैक्स सक्रिय है। हुक्म दीजिए, कोड हाजिर है।";
                } else if (q.includes('hello') || q.includes('hi') || q.includes('नमस्ते')) {
                    reply = "[ONLINE]: नमस्ते बॉस! बोलिए, कौन सा सिस्टम क्रैक करना है या क्या कोड बनाना है?";
                }

                appendMessage(reply, 'ai');
            }, 600);
        }

        sendBtn.addEventListener('click', () => {
            const text = userInput.value.trim();
            if(text) {
                appendMessage(text, 'user');
                userInput.value = '';
                processCyberQuery(text);
            }
        });

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendBtn.click();
            }
        });

        micBtn.addEventListener('click', () => {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = 'hi-IN';
                
                recognition.onstart = () => {
                    appendMessage("[MIC]: वॉइस इनपुट रिकॉर्ड हो रहा है...", 'ai');
                };
                
                recognition.onresult = (event) => {
                    const speechText = event.results[0][0].transcript;
                    appendMessage(speechText, 'user');
                    processCyberQuery(speechText);
                };
                
                recognition.onerror = (event) => {
                    appendMessage("[ERROR]: " + event.error, 'ai');
                };
                
                recognition.start();
            } else {
                appendMessage("[ERROR]: वॉइस इंजन उपलब्ध नहीं है।", 'ai');
            }
        });
    </script>
</body>
</html>
