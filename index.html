<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #030a16;
            color: #00f3ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .ai-container {
            width: 88%;
            max-width: 420px;
            background: rgba(4, 20, 40, 0.85);
            border: 2px solid #00f3ff;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
            backdrop-filter: blur(8px);
        }
        .ai-title {
            font-size: 26px;
            font-weight: 800;
            color: #00f3ff;
            text-shadow: 0 0 12px #00f3ff;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .ai-subtitle {
            font-size: 13px;
            color: #70d6ff;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        .orb-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 30px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ai-orb {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #00f3ff 0%, #0051ff 70%, #030a16 100%);
            border-radius: 50%;
            box-shadow: 0 0 30px #00f3ff, 0 0 60px #0051ff;
            animation: pulse 2s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 20px #00f3ff; }
            100% { transform: scale(1.08); box-shadow: 0 0 40px #00f3ff, 0 0 70px #0051ff; }
        }
        .mic-btn {
            background: linear-gradient(135deg, #0051ff, #00f3ff);
            color: #030a16;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
            transition: all 0.3s ease;
            outline: none;
            text-transform: uppercase;
        }
        .mic-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 35px #00f3ff;
        }
        .status-box {
            margin-top: 25px;
            padding: 12px;
            background: rgba(0, 243, 255, 0.08);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 8px;
            font-size: 14px;
            color: #a0efff;
            min-height: 48px;
        }
    </style>
</head>
<body>

    <div class="ai-container">
        <div class="ai-title">CYBERPUNK AI</div>
        <div class="ai-subtitle">SYSTEM ACTIVE • VOICE INTERFACE</div>
        
        <div class="orb-wrapper">
            <div class="ai-orb"></div>
        </div>

        <button class="mic-btn" id="micBtn">🎙️ Speak Now</button>

        <div class="status-box" id="output">Status: Ready to listen...</div>
    </div>

    <script>
        const micBtn = document.getElementById('micBtn');
        const output = document.getElementById('output');

        micBtn.addEventListener('click', () => {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                
                recognition.lang = 'hi-IN';
                recognition.onstart = () => {
                    output.innerText = "Listening... बोलिए, मैं सुन रहा हूँ...";
                };
                
                recognition.onresult = (event) => {
                    const speechToText = event.results[0][0].transcript;
                    output.innerText = "You said: " + speechToText;
                };
                
                recognition.onerror = (event) => {
                    output.innerText = "Error: " + event.error;
                };
                
                recognition.start();
            } else {
                output.innerText = "Voice Recognition support enabled in app.";
            }
        });
    </script>

</body>
</html>
