<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #030a16;
            color: #00f3ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
            padding: 15px;
        }
        .header {
            text-align: center;
            margin-top: 10px;
        }
        .ai-title {
            font-size: 22px;
            font-weight: 800;
            color: #00f3ff;
            text-shadow: 0 0 10px #00f3ff;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .ai-subtitle {
            font-size: 11px;
            color: #70d6ff;
            letter-spacing: 1px;
        }
        .chat-container {
            width: 100%;
            max-width: 450px;
            flex: 1;
            background: rgba(4, 20, 40, 0.75);
            border: 1px solid rgba(0, 243, 255, 0.4);
            border-radius: 12px;
            margin: 15px 0;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            backdrop-filter: blur(6px);
        }
        .message {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            max-width: 85%;
            line-height: 1.4;
        }
        .user-msg {
            background: rgba(0, 81, 255, 0.3);
            border: 1px solid #0051ff;
            color: #ffffff;
            align-self: flex-end;
        }
        .ai-msg {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid #00f3ff;
            color: #a0efff;
            align-self: flex-start;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.15);
        }
        .input-panel {
            width: 100%;
            max-width: 450px;
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .text-input {
            flex: 1;
            background: rgba(2, 10, 25, 0.9);
            border: 1px solid #00f3ff;
            border-radius: 25px;
            padding: 10px 16px;
            color: #00f3ff;
            font-size: 14px;
            outline: none;
        }
        .text-input::placeholder {
            color: rgba(0, 243, 255, 0.4);
        }
        .action-btn {
            background: linear-gradient(135deg, #0051ff, #00f3ff);
            color: #030a16;
            border: none;
            padding: 0 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="ai-title">CYBERPUNK AI v2.0</div>
        <div class="ai-subtitle">ADVANCED NEURAL INTERFACE</div>
    </div>

    <div class="chat-container" id="chatBox">
        <div class="message ai-msg">नमस्ते राजा! मैं आपका साइबरपंक AI असिस्टेंट हूँ। बोलिए या टाइप कीजिए, मैं आपकी क्या मदद करूँ?</div>
    </div>

    <div class="input-panel">
        <input type="text" id="userInput" class="text-input" placeholder="यहाँ कमांड या सवाल लिखें...">
        <button class="action-btn" id="sendBtn">Send</button>
        <button class="action-btn" id="micBtn">🎙️</button>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender === 'user' ? 'user-msg' : 'ai-msg'}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleAIResponse(query) {
            setTimeout(() => {
                let reply = `सिस्टम प्रोसेस हुआ: "${query}"। यह एक एडवांस साइबरपंक रिस्पांस है!`;
                if(query.toLowerCase().includes('hello') || query.toLowerCase().includes('hi')) {
                    reply = "नमस्ते! सिस्टम पूरी तरह सक्रिय है।";
                }
                appendMessage(reply, 'ai');
            }, 600);
        }

        sendBtn.addEventListener('click', () => {
            const text = userInput.value.trim();
            if(text) {
                appendMessage(text, 'user');
                userInput.value = '';
                handleAIResponse(text);
            }
        });

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendBtn.click();
            }
        });

        micBtn.addEventListener('click', () => {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = 'hi-IN';
                
                recognition.onstart = () => {
                    appendMessage("🎙️ सुन रहा हूँ...", 'ai');
                };
                
                recognition.onresult = (event) => {
                    const speechText = event.results[0][0].transcript;
                    appendMessage(speechText, 'user');
                    handleAIResponse(speechText);
                };
                
                recognition.onerror = (event) => {
                    appendMessage("वॉयस एरर: " + event.error, 'ai');
                };
                
                recognition.start();
            } else {
                appendMessage("वॉयस रिकग्निशन इस डिवाइस पर समर्थित नहीं है।", 'ai');
            }
        });
    </script>

</body>
</html>
