name: Supreme AI Core Android APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: 1. कोड चेकआउट करें (Checkout Repository)
      uses: actions/checkout@v4

    - name: 2. पाइथन 3.10 सेट अप करें (Set up Python 3.10)
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. जावा 17 सेट अप करें (Set up Java 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 4. स्वैप मेमोरी बढ़ाएं (Allocate Massive Swap Space - 16GB)
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile
        sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: 5. गिटहब कैशे इनेबल करें (Official GitHub Cache for Ccache)
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ccache-${{ runner.os }}-

    - name: 6. सभी मुख्य सिस्टम डिपेंडेंसी इंस्टॉल करें
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential git zip unzip autoconf libtool pkg-config \
          zlib1g-dev libffi-dev libssl-dev ccache cmake lld ninja-build \
          python3-dev python3-pip python3-setuptools curl wget patchelf \
          libncurses5-dev libsqlite3-dev libc6:i386 libstdc++6:i386 zlib1g:i386 \
          libltdl-dev libpcre3-dev libbz2-dev libreadline-dev tk-dev libsdl2-dev \
          libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev

    - name: 7. बिल्डोज़र और साइथन इंस्टॉल करें (Install Buildozer & Cython)
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        pip install cython==0.29.36 buildozer==1.5.0

    - name: 8. एंड्रॉइड SDK और कमांड-लाइन टूल्स सेट अप करें
      run: |
        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$SDK_DIR/cmdline-tools"
        
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
        unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools_extracted
        
        mkdir -p "$SDK_DIR/cmdline-tools/latest"
        mv /tmp/cmdtools_extracted/cmdline-tools/* "$SDK_DIR/cmdline-tools/latest/"
        rm -rf /tmp/cmdtools.zip /tmp/cmdtools_extracted
        
        mkdir -p "$SDK_DIR/tools/bin"
        ln -sf "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"
        
        echo "$SDK_DIR/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$SDK_DIR/platform-tools" >> $GITHUB_PATH

    - name: 9. सभी लाइसेंस स्वीकार करें और NDK लोड करें
      run: |
        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
        
        yes | "$SDKMANAGER" --licenses || true
        yes | "$SDKMANAGER" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "ndk;25.2.9519653" || true

    - name: 10. ज़ीरो-फॉल्ट प्रोडक्शन APK बिल्ड निष्पादित करें
      env:
        BUILDOZER_ALLOW_ROOT: "1"
        ACCEPT_BUILD_TOOLS_CHECKSUMS: "true"
        USE_CCACHE: "1"
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      run: |
        export GOOGLE_API_KEY="${GOOGLE_API_KEY}"
        export MAKEOPTS="-j2"
        # -v हटा दिया गया है ताकि विशाल लॉग्स के कारण टाइमआउट न हो
        buildozer android debug

    - name: 11. फाइनल APK आर्टिफैक्ट अपलोड करें (Upload Final APK)
      uses: actions/upload-artifact@v4
      with:
        name: Supreme-AI-Core-APK
        path: bin/*.apk
