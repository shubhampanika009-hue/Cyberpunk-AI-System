name: Supreme AI Core Production APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 4. Install All System Build Dependencies & Tools
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git zip unzip autoconf libtool pkg-config \
          zlib1g-dev libffi-dev libssl-dev ccache cmake lld \
          python3-dev python3-pip python3-setuptools curl wget \
          libncurses5-dev libsqlite3-dev libc6:i386 libstdc++6:i386 zlib1g:i386

    - name: 5. Install Buildozer & Cython
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        pip install cython==0.29.36 buildozer==1.5.0

    - name: 6. Pre-Accept All Android SDK Licenses (Bypass License Prompt)
      run: |
        # Buildozer के डिफ़ॉल्ट SDK लाइसेंस डायरेक्टरी बनाना
        ANDROID_HOME_PATH="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$ANDROID_HOME_PATH/licenses"
        
        # गूगल एंड्रॉइड लाइसेंस हैश को सीधे फ़ाइल में लिखना ताकि लाइसेंस ऑटो-एक्सेप्ट हो जाए
        echo -e "\n893378d70014b03d41422dd63abd657638232761\n24333f8a63b6825ea9c55727f37ce40d732b212d\nd56f5185472320386425163b279833479c597d24" > "$ANDROID_HOME_PATH/licenses/android-sdk-license"
        echo -e "\n84831b9409646a57801ebb35e80710100141a909" > "$ANDROID_HOME_PATH/licenses/android-sdk-preview-license"
        echo -e "\n7a2433f3fd12128e0e7a2753380b03fa149f1a23" > "$ANDROID_HOME_PATH/licenses/android-googletv-license"

    - name: 7. Execute Production Android Build
      env:
        BUILDOZER_ALLOW_ROOT: "1"
        ACCEPT_BUILD_TOOLS_CHECKSUMS: "true"
      run: |
        # yes कमांड से ऑटोमेटिक 'y' पास करना ताकि अगर कोई लाइसेंस बचे तो खुद अक्सेप्ट हो जाए
        yes | buildozer -v android debug

    - name: 8. Upload Final Production APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Supreme-AI-Core-APK
        path: bin/*.apk
