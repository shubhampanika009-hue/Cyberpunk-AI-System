name: Supreme AI Core Production APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    # 1. रिपॉजिटरी का कोड गिटहब रनर पर चेकआउट करना
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    # 2. पाइथन 3.10 का सटीक एनवायरनमेंट सेट करना
    - name: 2. Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. एंड्रॉइड कंपाइलेशन के लिए जाभा JDK 17 स्थापित करना
    - name: 3. Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 4. सिस्टम की सभी जरूरी C/C++ कंपाइलर और 32-bit/64-bit डिपेंडेंसी इंस्टॉल करना
    - name: 4. Install All System Dependencies & Compilers
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git zip unzip autoconf libtool pkg-config \
          zlib1g-dev libffi-dev libssl-dev ccache cmake lld \
          python3-dev python3-pip python3-setuptools \
          libncurses5-dev libsqlite3-dev libc6:i386 libstdc++6:i386 zlib1g:i386

    # 5. साइथन (Cython) और बिल्डोज़र (Buildozer) का स्टेबल वर्जन इंस्टॉल करना
    - name: 5. Install Stable Build Tools & Cython/Buildozer
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        pip install cython==0.29.36 buildozer==1.5.0

    # 6. एंड्रॉइड SDK और Cmdline-Tools को सुरक्षित तरीके से सेटअप करना (Exit Code 8 का स्थाई समाधान)
    - name: 6. Robust Android SDK & Cmdline-Tools Setup (Zero Exit Code 8 Error)
      run: |
        # एब्सोल्यूट पाथ तय करना ताकि पाथ मिसिंग का कोई चांस न रहे
        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        CMD_TOOLS_DIR="$SDK_DIR/cmdline-tools"
        
        echo "Creating safe directories..."
        mkdir -p "$CMD_TOOLS_DIR"
        
        echo "Downloading Android Command Line Tools securely to /tmp..."
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9441912_latest.zip -O /tmp/cmdtools.zip
        
        echo "Extracting tools safely..."
        unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools_extracted
        
        echo "Moving files to correct 'latest' directory structure..."
        rm -rf "$CMD_TOOLS_DIR/latest"
        mkdir -p "$CMD_TOOLS_DIR/latest"
        mv /tmp/cmdtools_extracted/cmdline-tools/* "$CMD_TOOLS_DIR/latest/"
        
        echo "Cleaning up temporary files..."
        rm -rf /tmp/cmdtools.zip /tmp/cmdtools_extracted
        
        echo "Command Line Tools successfully configured!"

    # 7. एंड्रॉइड एसडीके के सभी लाइसेंस अपने-आप स्वीकार (Accept) करना ताकि कभी रुकावट न आए
    - name: 7. Accept All Android SDK Licenses Automatically
      run: |
        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        SDKMANAGER_BIN="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
        
        mkdir -p "$SDK_DIR/licenses"
        yes | "$SDKMANAGER_BIN" --licenses || true

    # 8. मुख्य एंड्रॉइड APK बिल्ड प्रक्रिया को वर्बोस (Verbose) लॉगिंग के साथ चलाना
    - name: 8. Execute Production Android Build with Verbose Logging
      env:
        ACCEPT_BUILD_TOOLS_CHECKSUMS: "true"
      run: |
        buildozer -v android debug

    # 9. तैयार हुए APK को गिटहब आर्टिफैक्ट्स पर अपलोड करना ताकि आप इसे आसानी से डाउनलोड कर सकें
    - name: 9. Upload Final Production APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Supreme-AI-Core-APK
        path: bin/*.apk
