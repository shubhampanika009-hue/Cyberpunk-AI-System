name: Cyberpunk AI Ultra-Advanced Production Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build Cyberpunk AI Core APK (API 33)
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Buildozer Global Directory & SDK/NDK
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          ~/.android
          .buildozer
        key: ${{ runner.os }}-buildozer-ultra-${{ hashFiles('buildozer.spec') }}-${{ hashFiles('main.py') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-ultra-

    - name: Install System Dependencies & Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev ncurses-dev libsdl2-dev \
            libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libffi-dev \
            libssl-dev ccache lldb libltdl-dev build-essential patch ant \
            libltdl7 libstdc++6 libglu1-mesa-dev make gcc g++ gperf

    - name: Upgrade Python Packaging Infrastructure & Buildozer
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install --upgrade cython buildozer

    - name: Execute Buildozer Ultra-Verbose Android Build
      run: |
        buildozer -v android debug

    - name: Verify Build Artifact Output
      run: |
        ls -la bin/
        find bin/ -name "*.apk"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cyberpunk-AI-System-Ultimate-APK
        path: bin/*.apk
        retention-days: 90

    - name: Auto-Publish GitHub Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/heads/') || github.event_name == 'workflow_dispatch'
      with:
        tag_name: v1.0.0-${{ github.run_number }}
        name: "Cyberpunk AI Core // Release v1.0.0-${{ github.run_number }}"
        body: "Automated production release built via Ultra-Advanced Cyberpunk AI Pipeline. Commander: Raja Singh."
        files: bin/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
