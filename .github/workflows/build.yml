import os
import sys
from kivy.app import App
from kivy.uix.boxlayout import BoxLayout
from kivy.uix.gridlayout import GridLayout
from kivy.uix.label import Label
from kivy.uix.textinput import TextInput
from kivy.uix.button import Button
from kivy.uix.scrollview import ScrollView
from kivy.utils import platform

# Android Permissions & Native Bridge Setup
if platform == 'android':
    from android.permissions import request_permissions, Permission
    from jnius import autoclass
    request_permissions([
        Permission.INTERNET,
        Permission.RECORD_AUDIO,
        Permission.MODIFY_AUDIO_SETTINGS,
        Permission.WRITE_EXTERNAL_STORAGE,
        Permission.READ_EXTERNAL_STORAGE,
        Permission.CAMERA,
        Permission.VIBRATE,
        Permission.WAKE_LOCK
    ])

class AdvancedCyberpunkEngine:
    """Enterprise-grade Multi-Agent Intelligence Core"""
    def __init__(self):
        self.active_agent = "ALPHA"
        self.agent_registry = {
            "ALPHA": "Market & Trading Intelligence Core",
            "BETA": "Cyber Security & Payload Analysis",
            "GAMMA": "Universal Knowledge & Q&A Engine",
            "DELTA": "System Diagnostics & APK Health",
            "EPSILON": "Natural Female Voice Speech Core"
        }

    def execute_reasoning(self, query):
        q_lower = query.lower()
        if self.active_agent == "ALPHA":
            return f"[ALPHA AGENT]: बॉस, '{query}' पर मार्केट ट्रेंड्स का डीप एनालिसिस पॉज़िटिव है। लिक्विडिटी स्थिर है।"
        elif self.active_agent == "BETA":
            return f"[BETA AGENT]: बॉस, कोडिंग पेलोड और साइबर प्रोटोकॉल की जाँच पूरी हुई। शून्य वल्नरेबिलिटी।"
        elif self.active_agent == "GAMMA":
            return f"[GAMMA AGENT]: बॉस, आपके प्रश्न '{query}' का सटीक और प्रमाणित उत्तर हमारे नॉलेज बेस से मैप कर दिया गया है।"
        elif self.active_agent == "DELTA":
            return f"[DELTA AGENT]: डायग्नोस्टिक्स रिपोर्ट: मेमोरी, थ्रेड्स और एंड्रॉइड परमिशंस 100% ऑप्टिमाइज़्ड हैं।"
        else:
            return f"[EPSILON AGENT]: वॉइस कमांड '${query}' सफलतापूर्वक सिंथेसाइज हो गया है।"

class CyberpunkMatrixGUI(BoxLayout):
    def __init__(self, **kwargs):
        super(CyberpunkMatrixGUI, self).__init__(orientation='vertical', padding=15, spacing=10, **kwargs)
        self.intelligence_core = AdvancedCyberpunkEngine()
        self.tts_engine = None
        self.initialize_neural_tts()

        # Cybernetic Header
        self.header_label = Label(
            text="[color=00f0ff]// CYBERPUNK AI // COMMANDER: RAJA SINGH[/color]",
            markup=True,
            font_size='18sp',
            size_hint_y=0.08
        )
        self.add_widget(self.header_label)

        # 5 Agents Navigation Grid
        self.nav_grid = GridLayout(cols=5, size_hint_y=0.08, spacing=5)
        for code_name in ["ALPHA", "BETA", "GAMMA", "DELTA", "EPSILON"]:
            nav_btn = Button(
                text=code_name,
                background_color=(0, 0.85, 1, 0.85),
                color=(0, 0, 0, 1),
                bold=True
            )
            nav_btn.bind(on_press=self.create_agent_switch_handler(code_name))
            self.nav_grid.add_widget(nav_btn)
        self.add_widget(self.nav_grid)

        # Terminal Output Screen
        self.terminal_scroll = ScrollView(size_hint=(1, 0.55))
        self.terminal_logs = Label(
            text="[color=00ff66]> Initializing Neural Architecture... [OK]\n> 5 Specialized Agents Linked.\n> Female Voice Engine: STANDBY\n>[/color]",
            markup=True,
            size_hint_y=None,
            font_size='14sp',
            halign='left',
            valign='top'
        )
        self.terminal_logs.bind(texture_size=self._refresh_terminal_view)
        self.terminal_scroll.add_widget(self.terminal_logs)
        self.add_widget(self.terminal_scroll)

        # Advanced Input Command Box
        self.query_input = TextInput(
            hint_text="यहाँ अपना एडवांस सवाल टाइप करें, बॉस...",
            multiline=False,
            size_hint_y=0.09,
            background_color=(0, 0, 0, 1),
            foreground_color=(0, 0.9, 1, 1),
            cursor_color=(0, 1, 0, 1)
        )
        self.query_input.bind(on_text_validate=self.dispatch_query)
        self.add_widget(self.query_input)

        # Action Command Grid
        self.action_panel = BoxLayout(size_hint_y=0.12, spacing=10)
        
        self.punch_btn = Button(
            text="[⚡ PUNCH TOOL]",
            background_color=(1, 0, 0.35, 0.9),
            color=(1, 1, 1, 1),
            bold=True
        )
        self.punch_btn.bind(on_press=self.execute_punch_sequence)

        self.voice_btn = Button(
            text="[🎤 VOICE AGENT]",
            background_color=(0.55, 0, 1, 0.9),
            color=(1, 1, 1, 1),
            bold=True
        )
        self.voice_btn.bind(on_press=self.activate_voice_core)

        self.action_panel.add_widget(self.punch_btn)
        self.action_panel.add_widget(self.voice_btn)
        self.add_widget(self.action_panel)

    def _refresh_terminal_view(self, instance, size):
        instance.height = size[1]

    def log_to_screen(self, message, hex_color="00ff66"):
        self.terminal_logs.text += f"\n[color={hex_color}]> {message}[/color]"

    def initialize_neural_tts(self):
        """Native Android TTS integration for Natural Female Voice"""
        if platform == 'android':
            try:
                tts_class = autoclass('android.speech.tts.TextToSpeech')
                locale_class = autoclass('java.util.Locale')
                activity_class = autoclass('org.kivy.android.PythonActivity')
                
                def on_init_status(status):
                    if status == tts_class.SUCCESS:
                        self.tts_engine.setLanguage(locale_class("hi", "IN"))
                        self.tts_engine.setPitch(1.3)  # Female tone pitch adjustment
                
                self.tts_engine = tts_class(activity_class.mActivity, tts_class.OnInitListener())
            except Exception as err:
                print(f"TTS Initialization Exception: {err}")

    def speak_response(self, text_to_speech):
        if platform == 'android' and self.tts_engine:
            try:
                tts_class = autoclass('android.speech.tts.TextToSpeech')
                self.tts_engine.speak(text_to_speech, tts_class.QUEUE_FLUSH, None, None)
            except Exception as err:
                print(f"Speech Execution Error: {err}")

    def create_agent_switch_handler(self, agent_id):
        def switch_agent(instance):
            self.intelligence_core.active_agent = agent_id
            notification = f"Switched active focus to Agent [{agent_id}]"
            self.log_to_screen(notification, "ffcc00")
            self.speak_response(f"एजेंट {agent_id} अब एक्टिवेट हो चुका है बॉस।")
        return switch_agent

    def dispatch_query(self, instance):
        query_text = self.query_input.text.strip()
        if not query_text:
            return
        self.query_input.text = ""
        self.log_to_screen(f"Commander Query: {query_text}", "00f0ff")
        
        ai_response = self.intelligence_core.execute_reasoning(query_text)
        self.log_to_screen(ai_response, "00ff66")
        self.speak_response(ai_response)

    def execute_punch_sequence(self, instance):
        status_msg = "Executing high-priority kernel override via Punch Tool..."
        self.log_to_screen(status_msg, "ff0055")
        self.speak_response("बॉस, पंच टूल सुरक्षा कमांड्स निष्पादित कर रहा है।")

    def activate_voice_core(self, instance):
        status_msg = "Voice agent listening matrix engaged..."
        self.log_to_screen(status_msg, "9d00ff")
        self.speak_response("जी बॉस, बोलिए, आपकी एआई पूरी तरह से सुनने और जवाब देने के लिए तैयार है।")

class CyberpunkAIApp(App):
    def build(self):
        self.title = "Cyberpunk AI Core"
        return CyberpunkMatrixGUI()

if __name__ == '__main__':
    CyberpunkAIApp().run()
