name: Supreme AI Core Production APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 4. Install All System Dependencies & Compilers
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git zip unzip autoconf libtool pkg-config \
          zlib1g-dev libffi-dev libssl-dev ccache cmake lld \
          python3-dev python3-pip python3-setuptools curl wget \
          libncurses5-dev libsqlite3-dev

    - name: 5. Install Buildozer & Cython
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        pip install cython==0.29.36 buildozer==1.5.0

    - name: 6. Execute Production Android Build
      env:
        BUILDOZER_ALLOW_ROOT: "1"
        ACCEPT_BUILD_TOOLS_CHECKSUMS: "true"
      run: |
        buildozer -v android debug

    - name: 7. Upload Final Production APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Supreme-AI-Core-APK
        path: bin/*.apk
