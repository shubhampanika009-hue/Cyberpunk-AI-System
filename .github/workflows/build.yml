name: Supreme AI Core Production APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 4. Allocate Massive Swap Space (16GB Enterprise RAM Boost)
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile
        sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: 5. Install Full Enterprise System Build Tools & Heavy Packages
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential git zip unzip autoconf libtool pkg-config \
          zlib1g-dev libffi-dev libssl-dev ccache cmake lld ninja-build \
          python3-dev python3-pip python3-setuptools curl wget patchelf \
          libncurses5-dev libsqlite3-dev libc6:i386 libstdc++6:i386 zlib1g:i386 \
          libltdl-dev libpcre3-dev libbz2-dev libreadline-dev tk-dev

    - name: 6. Install Enterprise Buildozer & Cython Suite
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        pip install cython==0.29.36 buildozer==1.5.0

    - name: 7. Install & Configure Advanced Android SDK, NDK & Core Toolchains
      run: |
        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$SDK_DIR/cmdline-tools"
        
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
        unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools_extracted
        
        mkdir -p "$SDK_DIR/cmdline-tools/latest"
        mv /tmp/cmdtools_extracted/cmdline-tools/* "$SDK_DIR/cmdline-tools/latest/"
        rm -rf /tmp/cmdtools.zip /tmp/cmdtools_extracted
        
        mkdir -p "$SDK_DIR/tools/bin"
        ln -sf "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"
        
        echo "$SDK_DIR/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$SDK_DIR/platform-tools" >> $GITHUB_PATH

    - name: 8. Pre-Accept All SDK Licenses & Pre-load Heavy Android Toolchains
      run: |
        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
        
        yes | "$SDKMANAGER" --licenses || true
        yes | "$SDKMANAGER" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "ndk;25.2.9519653" || true

    - name: 9. Execute Enterprise-Grade Production Android Build (Zero-Fault Engine)
      env:
        BUILDOZER_ALLOW_ROOT: "1"
        ACCEPT_BUILD_TOOLS_CHECKSUMS: "true"
        USE_CCACHE: "1"
      run: |
        # बिल्ड की पूरी जानकारी और मैक्सिमम पावर के साथ निष्पादन
        buildozer -v android debug

    - name: 10. Upload Final Production APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Supreme-AI-Core-APK
        path: bin/*.apk
