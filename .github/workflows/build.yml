name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev ncurses-dev libreadline-dev libffi-dev libssl-dev build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev liblzma-dev tk-dev
        pip install --upgrade buildozer cython

    - name: Create Custom buildozer.spec
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = Cyberpunk AI
        package.name = cyberpunkai
        package.domain = org.cyberpunk
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,txt
        version = 0.1
        requirements = python3,kivy,requests,colorama
        orientation = portrait
        osx.python_version = 3
        osx.kivy_version = 1.9.1
        fullscreen = 0
        android.presplash_color = #000000
        android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE
        android.api = 33
        android.minapi = 21
        android.accept_sdk_license = True
        android.archs = arm64-v8a
        p4a.branch = master
        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cyberpunk-AI-App
        path: bin/*.apk
