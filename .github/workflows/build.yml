name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Buildozer dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev ncurses-dev libreadline-dev libffi-dev libssl-dev build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev liblzma-dev tk-dev
        pip install --upgrade buildozer cython

    - name: Create buildozer.spec
      run: |
        buildozer init
        sed -i 's/title = My Application/title = Cyberpunk AI/' buildozer.spec
        sed -i 's/package.name = myapp/package.name = cyberpunkai/' buildozer.spec
        sed -i 's/package.domain = org.test/package.domain = org.cyberpunk/' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3,requests,colorama/' buildozer.spec

    - name: Build APK with Buildozer
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Cyberpunk-AI-App
        path: bin/*.apk
