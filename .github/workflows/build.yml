name: Cyberpunk AI Ultimate Production Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Validate Java & Python Setup
      run: |
        java -version
        python3 --version
        echo "JAVA_HOME=$JAVA_HOME"

    - name: Cache Buildozer Global Directory & Android SDK/NDK
      uses: actions/cache@v3
      with:
        path: |
          ~/.buildozer
          ~/.android
          .buildozer
        key: ${{ runner.os }}-buildozer-ultimate-v7-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-ultimate-v7-

    - name: Install Advanced System Dependencies & Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev ncurses-dev libsdl2-dev \
            libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libffi-dev \
            libssl-dev ccache lldb libltdl-dev build-essential patch ant \
            libltdl7 libstdc++6 libglu1-mesa-dev make gcc g++

    - name: Upgrade Core Python Packaging Tools & Buildozer
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install --upgrade setuptools wheel cython==0.30.10
        python3 -m pip install --upgrade buildozer

    - name: Pre-configure Android Environment & Accept Licenses
      run: |
        mkdir -p ~/.buildozer/android/platform
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg

    - name: Build Android APK with Buildozer (Ultimate Verbose Mode)
      run: |
        buildozer -v android debug

    - name: Verify Generated APK Output
      run: |
        ls -la bin/
        find bin/ -name "*.apk"

    - name: Upload Generated APK Artifact (Production Ready)
      uses: actions/upload-artifact@v4
      with:
        name: Cyberpunk-AI-System-Ultimate-APK
        path: bin/*.apk
        retention-days: 30
