name: Supreme AI Core Production APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 4. Install All Advanced System Dependencies & Build Tools
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git zip unzip autoconf libtool pkg-config \
          zlib1g-dev libffi-dev libssl-dev ccache cmake lld \
          python3-dev python3-pip python3-setuptools curl wget \
          libncurses5-dev libsqlite3-dev libc6:i386 libstdc++6:i386 zlib1g:i386

    - name: 5. Install Buildozer & Cython
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        pip install cython==0.29.36 buildozer==1.5.0

    - name: 6. Install Advanced Android SDK & Cmdline Tools
      run: |
        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$SDK_DIR/cmdline-tools"
        
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
        unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools_extracted
        
        mkdir -p "$SDK_DIR/cmdline-tools/latest"
        mv /tmp/cmdtools_extracted/cmdline-tools/* "$SDK_DIR/cmdline-tools/latest/"
        rm -rf /tmp/cmdtools.zip /tmp/cmdtools_extracted
        
        mkdir -p "$SDK_DIR/tools/bin"
        ln -sf "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"
        
        echo "$SDK_DIR/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$SDK_DIR/platform-tools" >> $GITHUB_PATH

    - name: 7. Auto Accept All SDK Licenses & Pre-install Essential Android Tools
      run: |
        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
        
        yes | "$SDKMANAGER" --licenses || true
        yes | "$SDKMANAGER" "platform-tools" "build-tools;34.0.0" "platforms;android-34" || true

    - name: 8. Execute Production Android Build
      env:
        BUILDOZER_ALLOW_ROOT: "1"
        ACCEPT_BUILD_TOOLS_CHECKSUMS: "true"
      run: |
        buildozer -v android debug

    - name: 9. Upload Final Production APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Supreme-AI-Core-APK
        path: bin/*.apk
