name: Cyberpunk AI Advanced Build Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Buildozer Global Directory & SDK/NDK
      uses: actions/cache@v3
      with:
        path: |
          ~/.buildozer
          ~/.android
        key: ${{ runner.os }}-buildozer-v2-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-v2-

    - name: Install System Dependencies & Build Tools
      run: |
        sudo apt update
        sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev ncurses-dev libsdl2-dev \
            libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libffi-dev \
            libssl-dev ccache lldb libltdl-dev build-essential patch

    - name: Upgrade Pip & Install Buildozer/Cython
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install --upgrade cython==0.30.10 buildozer

    - name: Build Android APK with Buildozer (Verbose Mode)
      run: |
        buildozer -v android debug

    - name: Upload Generated APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cyberpunk-AI-System-Advanced-APK
        path: bin/*.apk
