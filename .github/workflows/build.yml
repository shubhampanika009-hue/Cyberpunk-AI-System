name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install All Complete System Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          curl \
          wget \
          zip \
          unzip \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncurses5:i386 \
          libstdc++6:i386 \
          zlib1g:i386 \
          libreadline-dev \
          libffi-dev \
          libssl-dev \
          libsqlite3-dev \
          sqlite3 \
          bzip2 \
          libbz2-dev \
          liblzma-dev \
          tk-dev \
          libltdl-dev \
          cmake \
          ninja-build \
          lld \
          ccache

    - name: Install Python Build Tools (Buildozer, Cython, Setuptools)
      run: |
        pip install --upgrade pip setuptools wheel
        pip install "cython<3.0.0" buildozer requests colorama

    - name: Create Complete Custom buildozer.spec
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = Cyberpunk AI
        package.name = cyberpunkai
        package.domain = org.cyberpunk
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,txt,json
        version = 0.1
        requirements = python3,kivy,requests,colorama,urllib3,certifi,chardet,idna
        orientation = portrait
        fullscreen = 0
        android.permissions = INTERNET,ACCESS_NETWORK_STATE,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE
        android.api = 33
        android.minapi = 21
        android.ndk = 25b
        android.accept_sdk_license = True
        android.archs = arm64-v8a
        p4a.branch = master

        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cyberpunk-AI-App
        path: bin/*.apk
